[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eda"
version = "0.1.0"
description = "Utilities for modifying and styling matplotlib charts"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "riceb53" }]
dependencies = ["matplotlib>=3.5"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["pytest>=7", "build", "twine"]

[project.urls]
Homepage = "https://github.com/riceb53/eda"

[tool.setuptools.packages.find]
where = ["src"]
